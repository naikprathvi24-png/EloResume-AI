
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - EloResume AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #10172a, #263b66);
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #ffffff;
            color: #1e293b;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 27px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        .email {
            font-weight: bold;
            color: #4f46e5;
            overflow-wrap: anywhere;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
        }

        .message {
            margin-bottom: 15px;
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Verify Your Email</h1>

        <p>We've sent a 6-digit verification code to:</p>

        <p class="email">{{ email }}</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('verify_otp') }}">
            <input
                type="text"
                name="otp"
                placeholder="000000"
                maxlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >

            <button type="submit">Verify Email</button>
        </form>

        <a class="back" href="{{ url_for('register') }}">
            Back to Sign Up
        </a>
    </div>
</body>
</html>
