
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - EloResume</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">

            <h1>EloResume</h1>

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to manage your resumes.
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST"
                  action="{{ url_for('login') }}">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
                <p style="text-align: center; margin-top: 15px;">
    <a href="{{ url_for('forgot_password') }}">
        Forgot Password?
    </a>
</p>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="bottom-text">
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Create Account
                </a>
            </p>

        </div>
    </div>

</body>
</html>
